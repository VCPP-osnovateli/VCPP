<!-- ===== MODAL: REGISTER (для личного кабинета) ===== -->
<div class="modal-overlay" id="registerModal">
    <div class="modal-box">
        <button class="modal-close" id="registerModalClose">&times;</button>
        <div class="modal-title">Регистрация <span class="red">личного кабинета</span></div>
        <form id="registerForm">
            <div class="form-group">
                <label>Ваше полное Фамилия Имя Отчество <span class="required">*</span></label>
                <input type="text" id="regFullName" placeholder="Иванов Иван Иванович" required />
            </div>
            <div class="form-group">
                <label>Федеральный округ проживания <span class="required">*</span></label>
                <input type="text" id="regDistrict" placeholder="Центральный, Приволжский..." required />
            </div>
            <div class="form-group">
                <label>Номер паспорта <span class="required">*</span></label>
                <input type="text" id="regPassport" placeholder="1234567" required />
            </div>
            <div class="form-group">
                <label>Ваш возраст <span class="required">*</span></label>
                <input type="number" id="regAge" placeholder="18" required />
            </div>
            <div class="form-group">
                <label>Discord (юзернейм) <span class="required">*</span></label>
                <input type="text" id="regDiscord" placeholder="ivan123" required />
            </div>
            <!-- НОВОЕ ПОЛЕ ПАРОЛЯ -->
            <div class="form-group">
                <label>Пароль <span class="required">*</span></label>
                <input type="password" id="regPassword" placeholder="Придумайте пароль" required />
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;">Зарегистрироваться</button>
        </form>
        <p style="margin-top:12px; font-size:13px; color:#6a7a8e;">Уже есть аккаунт? <a href="#" id="switchToLogin" style="color:var(--red); font-weight:600;">Войти</a></p>
    </div>
</div>
